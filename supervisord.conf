[supervisord]
nodaemon=true
user=root

[program:vnc]
command=/bin/bash -c "vncserver :1 -geometry ${RESOLUTION:-1280x720} -depth 24 -localhost no"
autostart=false
autorestart=false

[program:novnc]
command=/bin/bash -c "websockify --web=/usr/share/novnc/ 6080 localhost:5901"
autostart=false
autorestart=false
